[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nodly"
version = "0.1.0"
description = "Nodly backend: API, job worker and migrations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.16",  # 1.16+ reads [tool.alembic] from this file
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "phonenumbers>=8.13",  # the full package (not -lite): we use its timezone metadata
    "tzdata>=2025.2",  # pinned IANA data so zoneinfo + zone lists match on Windows, conda and Linux
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "time-machine>=2.15",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Long SQL strings in constraints can't be wrapped.
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run: the DB engine is session-scoped and asyncpg
# connections are bound to the loop that created them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# Alembic settings; logging config lives in alembic.ini. The DB URL comes from app settings.
[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(rev)s_%%(slug)s"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
