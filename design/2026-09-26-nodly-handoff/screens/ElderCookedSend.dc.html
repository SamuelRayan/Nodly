<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elder – Send your cooked photo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&amp;family=Newsreader:opsz,wght@6..72,500..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF6EE}
a{color:#1E1A15}a:hover{color:#2D6A4F}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E1A15;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 28px; background: #FAF6EE; color: #1E1A15; font-family: 'Atkinson Hyperlegible', Verdana, sans-serif; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<div style="display: flex">
<a href="ElderRecipeDetail.dc.html" style="display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 22px 0 16px; border-radius: 999px; border: 2px solid #1E1A15; color: #1E1A15; font-size: 20px; font-weight: 700; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>Cancel</a>
</div>
<h1 style="margin: 0 4px; font-family: 'Newsreader', Georgia, serif; font-size: 34px; line-height: 1.08; font-weight: 600; letter-spacing: -0.015em">Your lemon rice, for Kamala</h1>
<div style="position: relative; flex-grow: 1; min-height: 0; border-radius: 26px; overflow: hidden; box-shadow: 0 20px 40px -28px rgba(30, 26, 21, 0.55)">
<svg viewBox="0 0 342 456" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Your cooked lemon rice (placeholder photo)" style="display: block"><rect width="342" height="456" fill="#C9A27A"></rect><path d="M0 70h342M0 150h342M0 236h342M0 318h342M0 400h342" stroke="#B98F66" stroke-width="5"></path><circle cx="171" cy="228" r="138" fill="#D8DDE2"></circle><circle cx="171" cy="228" r="122" fill="#E6EAEE"></circle><path d="M96 222c10-44 70-66 118-52 42 12 58 48 40 78-20 34-78 48-120 34-34-12-44-34-38-60z" fill="#E9C23C"></path><circle cx="130" cy="214" r="6" fill="#B97A34"></circle><circle cx="182" cy="196" r="5.5" fill="#B97A34"></circle><circle cx="206" cy="246" r="6" fill="#B97A34"></circle><circle cx="152" cy="262" r="5" fill="#B97A34"></circle><ellipse cx="160" cy="206" rx="11" ry="5" fill="#3F6B55" transform="rotate(-30 160 206)"></ellipse><ellipse cx="220" cy="220" rx="11" ry="5" fill="#3F6B55" transform="rotate(20 220 220)"></ellipse><ellipse cx="124" cy="244" rx="10" ry="4.5" fill="#3F6B55" transform="rotate(40 124 244)"></ellipse><circle cx="178" cy="232" r="2.5" fill="#1E1A15"></circle><circle cx="140" cy="236" r="2.5" fill="#1E1A15"></circle><circle cx="198" cy="214" r="2.5" fill="#1E1A15"></circle><circle cx="286" cy="84" r="34" fill="#F2D55C"></circle><circle cx="286" cy="84" r="26" fill="#F7E58E"></circle><path d="M286 58v52M260 84h52M268 66l36 36M304 66l-36 36" stroke="#F2D55C" stroke-width="2.5"></path></svg>
<button type="button" style="position: absolute; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 18px; border-radius: 999px; border: none; background: #FFFDF9; color: #1E1A15; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 18px -10px rgba(30, 26, 21, 0.6)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path></svg>Take again</button>
</div>
<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px; min-width: 0">
<legend style="padding: 0 4px; margin-bottom: 8px; font-size: 20px; font-weight: 700">How did it turn out?</legend>
<sc-for list="{{ choices }}" as="c" hint-placeholder-count="3">
<label style="display: flex; align-items: center; gap: 14px; min-height: 58px; box-sizing: border-box; padding: 0 16px; border-radius: 18px; border: 2px solid {{ c.border }}; background: {{ c.bg }}; font-size: 20px; font-weight: 700; cursor: pointer">
<input type="radio" name="howItWent" value="{{ c.id }}" checked="{{ c.checked }}" onChange="{{ c.pick }}" style="width: 24px; height: 24px; margin: 0; flex-shrink: 0; accent-color: #2D6A4F">
<span>{{ c.label }}</span>
</label>
</sc-for>
</fieldset>
<a href="ElderCookedSent.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 76px; border-radius: 22px; background: #2D6A4F; color: #FFFFFF; font-size: 24px; font-weight: 700; text-decoration: none; box-shadow: 0 12px 26px -14px rgba(31, 77, 57, 0.75)">Send to Kamala<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const current = (this.state && this.state.choice) || 'great';
    const options = [
      { id: 'great', label: 'Turned out great' },
      { id: 'family', label: 'My family loved it' },
      { id: 'myway', label: 'I made it my way' }
    ];
    return {
      choices: options.map((o) => ({
        id: o.id,
        label: o.label,
        checked: current === o.id,
        border: current === o.id ? '#2D6A4F' : '#E0D6C6',
        bg: current === o.id ? '#EAF2EC' : '#FFFDF9',
        pick: () => this.setState({ choice: o.id })
      }))
    };
  }
}
</script>
</body>
</html>
