<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split screen – Family dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&amp;family=Newsreader:opsz,wght@6..72,500..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF6EE}
a{color:#1E1A15}a:hover{color:#2D6A4F}
a:focus-visible,button:focus-visible{outline:3px solid #1E1A15;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 420px; box-sizing: border-box; background: #FAF6EE; color: #1E1A15; font-family: 'Atkinson Hyperlegible', Verdana, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex-grow: 1; padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 20px; background: #FFFDF9; border: 1px solid #E7DFD2">
<div style="width: 40px; height: 40px; border-radius: 50%; background: #DCEBDF; color: #1F4D39; display: flex; align-items: center; justify-content: center; font-family: 'Newsreader', Georgia, serif; font-size: 19px; font-weight: 600">L</div>
<div style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 17px; font-weight: 700">Amma is okay</span><span style="font-size: 14px; color: #574E44">Checked in 8:14 AM her time</span></div>
<span style="width: 30px; height: 30px; border-radius: 50%; background: #2D6A4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
</div>
<a href="FamilyPost.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #F8E6C4; color: #1E1A15; text-decoration: none"><div style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 16px; font-weight: 700">Today’s moment</span><span style="font-size: 13px; color: #5C4A2A">Not shared yet</span></div><span style="height: 40px; padding: 0 14px; border-radius: 12px; background: #1E1A15; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center">Share</span></a>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 48px; border-radius: 14px; border: 1.5px solid #CFC4B3; background: #FFFDF9; color: #1E1A15; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Call Amma</button>
<a href="FamilyAmmasDay.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #CFC4B3; background: #FFFDF9; color: #1E1A15; font-size: 15px; font-weight: 700; text-decoration: none">Amma’s day</a>
</div>
</div>
<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px 12px 10px; background: #FFFDF9; border-top: 1px solid #E7DFD2">
<a href="FamilyDashboard.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; height: 44px; color: #1E1A15; font-size: 14px; font-weight: 700; text-decoration: none">Home</a>
<a href="FamilyMoments.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; color: #574E44; font-size: 14px; text-decoration: none">Moments</a>
<a href="FamilyRecipes.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; color: #574E44; font-size: 14px; text-decoration: none">Recipes</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
