<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split screen – Help alert</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&amp;family=Newsreader:opsz,wght@6..72,500..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#A5301F}
a{color:#FFFFFF}
a:focus-visible,button:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 420px; box-sizing: border-box; padding: 20px 18px 16px; background: #A5301F; color: #FFFFFF; font-family: 'Atkinson Hyperlegible', Verdana, sans-serif; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">Help alert</span>
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 34px; line-height: 1.05; font-weight: 600">Amma pressed Help</h1>
<p style="margin: 0; font-size: 16px; color: #FBE3DE">6:40 PM in Chennai · Arjun alerted too</p>
<div style="flex-grow: 1"></div>
<button type="button" style="height: 56px; border-radius: 18px; border: none; background: #FFFFFF; color: #8A2A1F; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer">Call Amma</button>
<a href="FamilyDashboard.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #5E1A10; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none">I’m on it</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
