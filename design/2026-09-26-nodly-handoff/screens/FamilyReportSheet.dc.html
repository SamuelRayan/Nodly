<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report a photo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&amp;family=Newsreader:opsz,wght@6..72,500..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF6EE}
a{color:#1E1A15}a:hover{color:#8A2A1F}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E1A15;outline-offset:3px}
@keyframes nodSheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FAF6EE; color: #1E1A15; font-family: 'Atkinson Hyperlegible', Verdana, sans-serif">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px"><dc-import name="FamilyRecipeDetail" hint-size="390px,844px"></dc-import></div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(30, 26, 21, 0.5)"></div>
<div role="dialog" aria-modal="true" aria-labelledby="reportTitle" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 24px; border-radius: 30px 30px 0 0; background: #FAF6EE; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -18px 40px -20px rgba(30, 26, 21, 0.5); animation: nodSheet 0.35s ease-out both">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #CFC4B3"></div>
<div style="display: flex; align-items: center; gap: 14px; padding-top: 4px">
<div style="position: relative; width: 56px; height: 56px; flex-shrink: 0; border-radius: 14px; overflow: hidden; background: #D9D2C6">
<div style="width: 56px; height: 56px; filter: blur(8px); transform: scale(1.2)"><svg viewBox="0 0 120 92" width="56" height="56" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><rect width="120" height="92" fill="#D9D2C6"></rect><circle cx="60" cy="46" r="32" fill="#EDE7DC"></circle><path d="M44 44c6-10 26-12 32 0 2 8-8 12-16 12s-18-4-16-12z" fill="#8A7A66"></path></svg></div>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E1A15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 17px; top: 17px"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-2.6 3.4"></path><path d="M6.4 6.4A17 17 0 0 0 2.5 12s3.5 7 9.5 7a9.6 9.6 0 0 0 5.6-1.8"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 id="reportTitle" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 26px; line-height: 1.1; font-weight: 600">Report Dan’s photo</h2>
<span style="font-size: 14px; color: #574E44">Sent to Amma · 2 hours ago</span>
</div>
</div>
<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px; min-width: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 15px; font-weight: 700">What’s wrong with it?</legend>
<sc-for list="{{ reasons }}" as="r" hint-placeholder-count="5">
<label style="display: flex; align-items: center; gap: 12px; min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1.5px solid {{ r.border }}; background: {{ r.bg }}; font-size: 16px; font-weight: 700; cursor: pointer">
<input type="radio" name="reason" value="{{ r.id }}" checked="{{ r.checked }}" onChange="{{ r.pick }}" style="width: 20px; height: 20px; margin: 0; flex-shrink: 0; accent-color: #B23A2B">
<span>{{ r.label }}</span>
</label>
</sc-for>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 16px; background: #F3EDE2">
<span style="display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 1.35"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F4D39" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>The photo is removed from Amma’s Nodly right away</span>
<span style="display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 1.35"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A2A1F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg>Dan is banned from sending Amma anything</span>
<span style="display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 1.35"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#574E44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Our team reviews it. Serious cases lose their account.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<a href="FamilySenderWarning.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 18px; background: #B23A2B; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h12l-2.5 4.5L17 13H5"></path></svg>Report and ban Dan</a>
<a href="FamilyRecipeDetail.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; font-size: 15px; font-weight: 700; color: #1E1A15; text-underline-offset: 3px">Cancel</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const current = (this.state && this.state.reason) || 'disturbing';
    const options = [
      { id: 'disturbing', label: 'Disturbing or violent' },
      { id: 'sexual', label: 'Sexual or nude' },
      { id: 'scam', label: 'Scam or spam' },
      { id: 'offtopic', label: 'Not about cooking' },
      { id: 'other', label: 'Something else' }
    ];
    return {
      reasons: options.map((o) => ({
        id: o.id,
        label: o.label,
        checked: current === o.id,
        border: current === o.id ? '#B23A2B' : '#E0D6C6',
        bg: current === o.id ? '#FBEDEA' : '#FFFDF9',
        pick: () => this.setState({ reason: o.id })
      }))
    };
  }
}
</script>
</body>
</html>
