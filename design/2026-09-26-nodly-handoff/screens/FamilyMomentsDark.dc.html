<!doctype html>
<html lang="en">
<head>

<title>Family – Moments (dark)</title>

</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0;background:#16130F}
a{color:#F2ECE2}a:hover{color:#2D6A4F}

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16130F; color: #F2ECE2; font-family: 'Atkinson Hyperlegible', Verdana, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex-grow: 1; min-height: 0; padding: 56px 20px 18px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 32px; line-height: 1.1; font-weight: 600; letter-spacing: -0.01em">Moments</h1>
<span style="font-size: 15px; color: #B8AC9C">Everything shared with Amma</span>
</div>

</div>
</sc-if>
<sc-if value="{{ isFlowers }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0">
<svg viewBox="0 0 342 456" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Photo from Priya (placeholder): flowers in a garden" style="display: block"><rect width="342" height="456" fill="#E7EEDF"></rect><circle cx="282" cy="84" r="118" fill="#F1F4EA"></circle><rect y="336" width="342" height="120" fill="#C9D8BA"></rect><path d="M96 456 C 98 390 88 340 100 286" stroke="#4F7A5C" stroke-width="6" fill="none" stroke-linecap="round"></path><path d="M180 456 C 176 380 186 300 178 228" stroke="#4F7A5C" stroke-width="6" fill="none" stroke-linecap="round"></path><path d="M258 456 C 262 400 250 352 262 310" stroke="#4F7A5C" stroke-width="6" fill="none" stroke-linecap="round"></path><ellipse cx="118" cy="372" rx="26" ry="10" fill="#6F977B" transform="rotate(-30 118 372)"></ellipse><ellipse cx="158" cy="330" rx="28" ry="10" fill="#6F977B" transform="rotate(28 158 330)"></ellipse><ellipse cx="238" cy="386" rx="26" ry="10" fill="#6F977B" transform="rotate(30 238 386)"></ellipse><g transform="translate(100 272)"><circle cx="20" cy="0" r="16" fill="#EFB39C"></circle><circle cx="10" cy="17.3" r="16" fill="#EFB39C"></circle><circle cx="-10" cy="17.3" r="16" fill="#EFB39C"></circle><circle cx="-20" cy="0" r="16" fill="#EFB39C"></circle><circle cx="-10" cy="-17.3" r="16" fill="#EFB39C"></circle><circle cx="10" cy="-17.3" r="16" fill="#EFB39C"></circle><circle r="13" fill="#E8A33D"></circle></g><g transform="translate(178 212)"><circle cx="25" cy="0" r="20" fill="#E99A86"></circle><circle cx="12.5" cy="21.6" r="20" fill="#E99A86"></circle><circle cx="-12.5" cy="21.6" r="20" fill="#E99A86"></circle><circle cx="-25" cy="0" r="20" fill="#E99A86"></circle><circle cx="-12.5" cy="-21.6" r="20" fill="#E99A86"></circle><circle cx="12.5" cy="-21.6" r="20" fill="#E99A86"></circle><circle r="16" fill="#F2C879"></circle></g><g transform="translate(262 296)"><circle cx="17" cy="0" r="14" fill="#F4D08A"></circle><circle cx="8.5" cy="14.7" r="14" fill="#F4D08A"></circle><circle cx="-8.5" cy="14.7" r="14" fill="#F4D08A"></circle><circle cx="-17" cy="0" r="14" fill="#F4D08A"></circle><circle cx="-8.5" cy="-14.7" r="14" fill="#F4D08A"></circle><circle cx="8.5" cy="-14.7" r="14" fill="#F4D08A"></circle><circle r="11" fill="#C9713F"></circle></g></svg>
</div>
</sc-if>
<sc-if value="{{ isVideo }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0">
<svg viewBox="0 0 342 456" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Video from Arjun (placeholder): flying a kite in the park" style="display: block"><rect width="342" height="456" fill="#DDE6F0"></rect><circle cx="78" cy="104" r="34" fill="#F2C879"></circle><path d="M250 112 l18 22 l-18 22 l-18 -22 z" fill="#E8A33D"></path><path d="M250 156 C 240 214 222 258 196 318" stroke="#5C4A2A" stroke-width="1.5" fill="none"></path><path d="M0 300 C 90 262 190 280 342 250 L 342 456 L 0 456 Z" fill="#9DBF9A"></path><path d="M0 360 C 110 336 230 352 342 330 L 342 456 L 0 456 Z" fill="#6F977B"></path><rect x="64" y="276" width="10" height="70" rx="4" fill="#7A5A3A"></rect><circle cx="69" cy="262" r="34" fill="#4F7A5C"></circle><circle cx="44" cy="282" r="22" fill="#4F7A5C"></circle><circle cx="94" cy="282" r="22" fill="#4F7A5C"></circle></svg>
<button type="button" aria-label="Play video from Arjun" style="position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; border: none; background: rgba(33, 29, 24, 0.95); color: #F2ECE2; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: 0 12px 26px -12px rgba(30, 26, 21, 0.6)"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"></path></svg></button>
</div>
</sc-if>
<span style="position: absolute; left: 12px; top: 12px; padding: 6px 12px; border-radius: 999px; background: rgba(33, 29, 24, 0.95); color: #F2ECE2; font-size: 14px; font-weight: 700">{{ cur.kind }}</span>
<div style="position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px; background: rgba(33, 29, 24, 0.95)">
<div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: {{ cur.avatarBg }}; color: {{ cur.avatarFg }}; display: flex; align-items: center; justify-content: center; font-family: 'Newsreader', Georgia, serif; font-size: 20px; font-weight: 600">{{ cur.initial }}</div>
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 16px; font-weight: 700">{{ cur.who }}</span>
<span style="font-size: 14px; color: #B8AC9C">{{ cur.when }}</span>
</div>
</div>
</div>
<div aria-hidden="true" style="width: 14px; flex-shrink: 0; border-radius: 18px 0 0 18px; background: {{ nextColor }}"></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 2px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700">
<sc-if value="{{ cur.loved }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="#B23A2B" stroke="#B23A2B" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"></path></svg></sc-if>
<sc-if value="{{ cur.notLoved }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F4D39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
<span>{{ cur.status }}</span>
</span>
<span style="font-size: 14px; color: #B8AC9C; font-variant-numeric: tabular-nums; white-space: nowrap">{{ position }}</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="Newer moment" onClick="{{ prev }}" style="width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid #4A433A; background: #211D18; color: #F2ECE2; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></button>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 6px">
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="4"><span style="width: {{ d.w }}; height: 8px; border-radius: 999px; background: {{ d.bg }}"></span></sc-for>
</div>
<button type="button" aria-label="Older moment" onClick="{{ next }}" style="width: 52px; height: 52px; border-radius: 50%; border: none; background: #3A332A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button>
</div>
</section>
</div>
<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 12px 22px; background: #211D18; border-top: 1px solid #3A342C">
<a href="FamilyDashboardDark.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px; color: #B8AC9C; font-size: 13px; text-decoration: none"><span style="width: 60px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"></path></svg></span>Home</a>
<a href="FamilyMomentsDark.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px; color: #F2ECE2; font-size: 13px; font-weight: 700; text-decoration: none"><span style="width: 60px; height: 32px; border-radius: 999px; background: #2A251F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg></span>Moments</a>
<a href="FamilyRecipesDark.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px; color: #B8AC9C; font-size: 13px; text-decoration: none"><span style="width: 60px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path><path d="M2 10h20"></path><path d="M9 3.5c0 1.2 1 1.3 1 2.5"></path><path d="M13 3.5c0 1.2 1 1.3 1 2.5"></path></svg></span>Recipes</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      { id: 'hills', kind: 'Photo', who: 'Priya', initial: 'P', when: 'Yesterday, 9:12 PM', status: 'Amma saw it and sent love', loved: true, color: '#F4D9B0' },
      { id: 'voice', kind: 'Voice note · 0:42', who: 'Arjun', initial: 'A', when: 'Yesterday, 7:30 PM', status: 'Amma listened to it', loved: false, color: '#F8E6C4' },
      { id: 'flowers', kind: 'Photo', who: 'Priya', initial: 'P', when: 'Thursday, 24 September', status: 'Amma saw it', loved: false, color: '#E7EEDF' },
      { id: 'video', kind: 'Video · 0:18', who: 'Arjun', initial: 'A', when: 'Tuesday, 22 September', status: 'Amma watched it and sent love', loved: true, color: '#DDE6F0' }
    ];
    const n = items.length;
    const i = this.state && typeof this.state.i === 'number' ? this.state.i : 0;
    const c = items[i];
    const isPriya = c.who === 'Priya';
    return {
      cur: {
        kind: c.kind, who: c.who, initial: c.initial, when: c.when, status: c.status, color: c.color,
        loved: c.loved, notLoved: !c.loved,
        avatarBg: isPriya ? '#F8E6C4' : '#DDE6F0',
        avatarFg: isPriya ? '#5C4A2A' : '#2B3F55'
      },
      isHills: c.id === 'hills',
      isVoice: c.id === 'voice',
      isFlowers: c.id === 'flowers',
      isVideo: c.id === 'video',
      prevColor: items[(i - 1 + n) % n].color,
      nextColor: items[(i + 1) % n].color,
      position: (i + 1) + ' of ' + n,
      dots: items.map((it, k) => ({ w: k === i ? '22px' : '8px', bg: k === i ? '#F2ECE2' : '#4A433A' })),
      prev: () => this.setState({ i: (i - 1 + n) % n }),
      next: () => this.setState({ i: (i + 1) % n })
    };
  }
}
</script>
</body>
