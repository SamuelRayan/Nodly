<div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 50%; background: #DDE6F0; color: #2B3F55; display: flex; align-items: center; justify-content: center; font-family: 'Newsreader', Georgia, serif; font-size: 28px; font-weight: 600">M</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 24px; font-weight: 700">Meera, from Pune</span>
<span style="font-size: 18px; color: #574E44">Not family · cooked your recipe</span>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">

<a href="ElderHomeDone.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 72px; border-radius: 22px; background: #1E1A15; color: #FFFFFF; font-size: 22px; font-weight: 700; text-decoration: none">Next<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
</div>
<a href="ElderReportConfirm.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 58px; box-sizing: border-box; border-radius: 20px; border: 2px solid #B23A2B; background: #FFFDF9; color: #8A2A1F; font-size: 20px; font-weight: 700; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h12l-2.5 4.5L17 13H5"></path></svg>Report this photo</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"liked":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const fromState = this.state && typeof this.state.liked === 'boolean' ? this.state.liked : null;
    const liked = fromState !== null ? fromState : (this.props.liked ?? false);
    return {
      pressed: liked ? 'true' : 'false',
      likeLabel: liked ? 'Liked' : 'Like',
      heartFill: liked ? '#B23A2B' : 'none',
      likeBg: liked ? '#FBE3DE' : '#F8E6C4',
      likeBorder: liked ? '#B23A2B' : '#F8E6C4',
      toggleLike: () => this.setState({ liked: !liked })
    };
  }
}
</script>
</body>
</html>
